<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ass6 - 2</title>
    <style>
        .border{
            width: 500px;
            height: 500px;
            outline: 10px groove orange;
            outline-offset: 10px;
            margin: 10% auto;
            position: relative; /*ให้ยึดตำแหน่งเดิมเป็นหลัก*/
            border: 30px solid transparent; /*ขนาดความหนาขอบภาพด้านใน*/ 
            border-image: url("img/picture-frame-427233_640.jpg") 40 round; 
            /*นำรูปภาพมาตรึงแต่ละมุมด้วยความละเอียด 40 ทั้ง 4 มุม*/
            box-sizing: border-box;
        }
        .pic{
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute; /*สามารถขยับได้อิสระ*/
        }
    </style>
</head>
<body>
    <div class="border">
        <img src="img/test_1.png" alt="kuay" class="pic">
    </div>
</body>
</html>
