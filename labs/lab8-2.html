<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Lab08 ข้อ 2</title>
  <style>
    header {
      background-color: pink;
      color: yellow;
      padding: 30px;
      border-bottom: 8px solid blue;
    }

    ul {
      list-style-type: none;
      margin: 0;
      padding: 0;
      width: 200px;
      background-color: #f1f1f1;
    }

    li a {
      display: block;
      color: black;
      padding: 8px 16px;
      text-decoration: none;
    }

    li a:hover {
      background-color: yellow;
      color: green;
    }
  </style>
</head>
<body>

  <header>
    <h1>HEADER</h1>
  </header>

  <ul>
    <li><a href="#">Home</a></li>
    <li><a href="#">New</a></li>
    <li><a href="#">Content</a></li>
    <li><a href="#">About</a></li>
  </ul>

</body>
</html>
