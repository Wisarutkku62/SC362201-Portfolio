<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab12</title>
  <link rel="stylesheet" href="css/lab12-1.css">
</head>

<body>
  <div class="form-wrapper">
    <h1>Design Form</h1>

    <fieldset>
      <form>
        <div class="form-row">
          <div class="form-label">Name:</div>
          <div class="form-content">
            <input type="text">
          </div>
        </div>
        <div class="form-row">
          <div class="form-label">Email Address:</div>
          <div class="form-content">
            <input type="email">
          </div>
        </div>
        <div class="form-row align-top">
          <div class="form-label">Feedback:</div>
          <div class="form-content">
            <textarea></textarea>
          </div>
        </div>
        <div class="form-row">
          <div class="form-label">Tel:</div>
          <div class="form-content">
            <input type="tel">
          </div>
        </div>
        <div class="form-row">
          <div class="form-label">Sex:</div>
          <div class="form-content">
            <span class="option-item">Male: <input type="radio" name="sex"></span>
            <span class="option-item">Female: <input type="radio" name="sex"></span>
          </div>
        </div>
        <div class="form-row">
          <div class="form-label">Hobbies:</div>
          <div class="form-content">
            <span class="option-item"><input type="checkbox"> Tennis</span>
            <span class="option-item"><input type="checkbox"> Reading</span>
            <span class="option-item"><input type="checkbox"> Basketball</span>
          </div>
        </div>
        <div class="form-row">
          <div class="form-label">Agree to Terms?</div>
          <div class="form-content">
            <input type="checkbox">
          </div>
        </div>
        <div class="button-group">
          <input type="submit" value="Submit">
          <input type="reset" value="Reset">
        </div>
      </form>
    </fieldset>
  </div>
</body>

</html>
