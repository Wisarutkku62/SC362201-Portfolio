<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lab 4</title>
  <style>
    h1 {
      background-color: yellow;
      border: 5px dotted red;
      text-align: center;
    }

    h1::first-letter {
      color: green;
      font-size: 50px;
    }

    a:link {
      background-color: greenyellow;
    }

    a:hover {
      background-color: pink;
    }

    a:active {
      background-color: yellow;
    }

    a:visited {
      background-color: orange;
    }
  </style>
</head>
<body>

  <h1>Link to Google</h1>

  <a href="https://www.google.com" target="_blank">www.Google.com</a>

</body>
</html>
