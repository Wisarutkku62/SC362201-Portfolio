<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab06</title>
    <style>
        .text1 {
            background-color: rgb(74, 255, 156);
            border-bottom: green solid 10px;
        }

        .text2 {
            border: rgb(255, 2, 2) groove 4px;
        }

        .text3 {
            border-top: 10px double blue;
            border-left: 8px groove rgb(1, 150, 68);
            border-bottom: 10px dashed rgb(255, 136, 0);
        }

        .text4 {
            text-align: center;
            background-color: rgb(127, 150, 255);
            margin: 10%;
            padding: 10px;
        }

        .text5 {
            text-align: center;
            background-color: yellow;
            border: red solid;
            padding: 10px;
            margin-left: 30%;
            margin-right: 30%;
        }

        .main {
            width: 500px;
            height: 200px;
            margin: 10% auto;
            text-align: center;
            outline: 10px groove rgb(255, 136, 0);
            outline-offset: 20px;
            border-top: 10px dashed black;
            border-left: 8px groove rgb(1, 150, 68);
            border-right: 10px double blue;
            border-bottom: 10px dotted rgb(255, 136, 0);
            border-radius: 10px;
            box-sizing: border-box;
        }
    </style>
</head>

<body>
    <h1 class="text1">THIS IS A HEADING</h1>
    <p class="text2">This is a paragraph</p>
    <p class="text3">This is a paragraph</p>
    <h1 class="text4">THIS IS A HEADING</h1>
    <p class="text5">This is a paragraph</p>
    <div class="main">
        <h1>HELLO WORLD!</h1>
    </div>
</body>

</html>
